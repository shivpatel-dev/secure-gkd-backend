services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: secure_gkd
      POSTGRES_USER: secure_gkd_user
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  application:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/secure_gkd
      SPRING_DATASOURCE_USERNAME: secure_gkd_user
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
      JWT_SIGNING_KEY_BASE64: ${JWT_SIGNING_KEY_BASE64:?Set JWT_SIGNING_KEY_BASE64 in .env}
      JWT_ACCESS_TOKEN_LIFETIME: ${JWT_ACCESS_TOKEN_LIFETIME:-PT15M}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
