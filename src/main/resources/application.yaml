spring:
  application:
    name: secure-gkd-backend

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

secure-gkd:
  security:
    jwt:
      signing-key-base64: ${JWT_SIGNING_KEY_BASE64}
      access-token-lifetime: ${JWT_ACCESS_TOKEN_LIFETIME:PT15M}
