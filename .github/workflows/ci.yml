name: Java CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: secure_gkd
          POSTGRES_USER: secure_gkd_user
          POSTGRES_PASSWORD: secure_gkd_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secure_gkd_user -d secure_gkd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      audit-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: secure_gkd_audit
          POSTGRES_USER: secure_gkd_audit_user
          POSTGRES_PASSWORD: secure_gkd_audit_ci_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U secure_gkd_audit_user -d secure_gkd_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run allocation-service tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/secure_gkd
          SPRING_DATASOURCE_USERNAME: secure_gkd_user
          SPRING_DATASOURCE_PASSWORD: secure_gkd_ci_password
        run: ./mvnw test

      - name: Build allocation-service package
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/secure_gkd
          SPRING_DATASOURCE_USERNAME: secure_gkd_user
          SPRING_DATASOURCE_PASSWORD: secure_gkd_ci_password
        run: ./mvnw package

      - name: Run audit-service tests
        env:
          AUDIT_DATASOURCE_URL: jdbc:postgresql://localhost:5433/secure_gkd_audit
          AUDIT_DATASOURCE_USERNAME: secure_gkd_audit_user
          AUDIT_DATASOURCE_PASSWORD: secure_gkd_audit_ci_password
        run: ./mvnw -f audit-service/pom.xml test

      - name: Build audit-service package
        env:
          AUDIT_DATASOURCE_URL: jdbc:postgresql://localhost:5433/secure_gkd_audit
          AUDIT_DATASOURCE_USERNAME: secure_gkd_audit_user
          AUDIT_DATASOURCE_PASSWORD: secure_gkd_audit_ci_password
        run: ./mvnw -f audit-service/pom.xml package
