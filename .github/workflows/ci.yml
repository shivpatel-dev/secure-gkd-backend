name: Java CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: secure_gkd
          POSTGRES_USER: secure_gkd_user
          POSTGRES_PASSWORD: secure_gkd_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secure_gkd_user -d secure_gkd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/secure_gkd
      SPRING_DATASOURCE_USERNAME: secure_gkd_user
      SPRING_DATASOURCE_PASSWORD: secure_gkd_ci_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test

      - name: Build package
        run: ./mvnw package